<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Meta Growth Gap</title>
<!--FONTS-->
<style>
/* Layout: an A4 book. Light reading pages, full-bleed dark openers for parts and chapters, Ads Yeti orange used sparingly. */
:root{
  --paper:#F6F7FA; --ink:#0B1020; --body:#2C3345; --muted:#677189; --line:#DCE0E9;
  --night:#070B14; --navy:#0D1526; --card:#131C30; --soft:#A3ACC1; --dim:#6E7891;
  --orange:#FF6B00; --orange-2:#FF8A3D; --rust:#C2410C; --red:#F87171;
  --display:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@page{
  size:A4; margin:22mm 21mm 24mm;
  @bottom-left{content:"THE ADS YETI  ·  THE META GROWTH GAP";font-family:'JetBrains Mono',monospace;font-size:6.8pt;letter-spacing:.18em;color:#8b93a7}
  @bottom-right{content:counter(page);font-family:'JetBrains Mono',monospace;font-size:7.5pt;color:#8b93a7}
}
@page full{margin:0;@bottom-left{content:none}@bottom-right{content:none}}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper)}
body{background:var(--paper);color:var(--body);font-family:var(--display);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
img{max-width:100%}

/* ---------- openers (cover, parts, chapters) ---------- */
.opener{position:relative;overflow:hidden;background:var(--night);color:#F1F4FA;padding:72px max(24px,6vw) 64px;min-height:78vh;display:flex;flex-direction:column}
.opener.navy{background:var(--navy)}
.opener .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.opener .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,20,.25) 0%,rgba(7,11,20,.55) 45%,rgba(7,11,20,.96) 78%)}
.opener .bg.side{left:45%}
.opener .bg.side::after{background:linear-gradient(90deg,var(--night) 0%,rgba(7,11,20,.6) 35%,rgba(7,11,20,.15) 100%)}
.opener>*:not(.bg){position:relative}
.op-lbl{font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange-2)}
.op-spacer{flex:1;min-height:60px}
.op-num{font-family:var(--display);font-weight:800;font-size:150px;line-height:.8;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:2px var(--orange);margin-bottom:28px}
.op-title{font-weight:800;font-size:clamp(44px,7vw,74px);line-height:1;letter-spacing:-.04em;max-width:640px;text-wrap:balance}
.op-dek{margin-top:22px;font-size:19px;line-height:1.55;color:#C4CBDA;max-width:560px}
.op-foot{margin-top:48px;display:flex;justify-content:space-between;gap:16px;font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:#7D879F}
.cover .op-title{font-size:clamp(52px,9vw,92px)}
.cover .by{margin-top:28px;font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#C4CBDA}

/* ---------- reading pages ---------- */
.txt{max-width:700px;margin:0 auto;padding:64px 20px 72px}
.lbl{font-family:var(--mono);font-weight:500;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--rust)}
.txt h2{font-weight:800;font-size:36px;line-height:1.12;letter-spacing:-.03em;color:var(--ink);margin:10px 0 22px;text-wrap:balance}
.txt h3{font-weight:700;font-size:22px;line-height:1.25;letter-spacing:-.02em;color:var(--ink);margin:38px 0 12px;text-wrap:balance}
.txt p{margin:0 0 16px;orphans:3;widows:3}
.txt p.lead{font-size:20px;line-height:1.55;color:#1d2436}
.txt strong{color:var(--ink);font-weight:700}
.txt ul.plain{margin:4px 0 18px 0;list-style:none}
.txt ul.plain li{position:relative;padding-left:22px;margin-bottom:8px}
.txt ul.plain li::before{content:"";position:absolute;left:2px;top:.72em;width:8px;height:2px;background:var(--orange)}
.sec{break-before:page}

.pull{margin:30px 0;padding:4px 0 4px 24px;border-left:3px solid var(--orange);font-size:24px;line-height:1.38;font-weight:600;letter-spacing:-.015em;color:var(--ink);break-inside:avoid}
.pull cite{display:block;margin-top:10px;font-style:normal;font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}

.box{background:var(--night);color:#C9D0DE;border-radius:14px;padding:24px 26px;margin:28px 0;break-inside:avoid}
.box .lbl{color:var(--orange-2)}
.box h4{font-size:19px;color:#fff;margin:8px 0 8px;letter-spacing:-.01em;line-height:1.3}
.box p{color:#C9D0DE;margin-bottom:10px}
.box p:last-child{margin-bottom:0}
.box strong{color:#fff}

.gap{border:1.5px dashed var(--rust);background:#FFF4EC;border-radius:12px;padding:16px 20px;margin:26px 0;break-inside:avoid;font-size:15px;line-height:1.55;color:#5a2a0c}
.gap .lbl{display:block;margin-bottom:6px}
.gap p{margin:0}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:24px 0;break-inside:avoid}
.stat{background:#fff;border:1px solid var(--line);border-top:3px solid var(--orange);border-radius:12px;padding:16px 16px 18px;min-width:0}
.stat .n{font-weight:800;font-size:34px;letter-spacing:-.04em;line-height:1.05;color:var(--rust);font-variant-numeric:tabular-nums}
.stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:8px}
.stat .d{font-size:13.5px;line-height:1.45;margin-top:6px;color:var(--body)}

.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:24px 0;break-inside:avoid}
.step{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 13px;min-width:0}
.step .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.step b{display:block;font-size:15px;color:var(--ink);line-height:1.25;margin:6px 0 4px}
.step span{display:block;font-size:13px;line-height:1.45}
.step.hot{border-top:3px solid var(--orange)}
.step.hot .k{color:var(--rust)}

.flow{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:center;margin:22px 0;break-inside:avoid}
.flow span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap}
.flow i{font-style:normal;color:var(--orange);font-weight:700}
.flow span.on{background:var(--orange);border-color:var(--orange);color:var(--ink)}

/* leak sections */
.leak-head{break-before:page;background:var(--night);color:#F1F4FA;border-radius:16px;padding:30px 30px 32px;margin:0 0 30px;position:relative;overflow:hidden}
.leak-head .n{position:absolute;right:22px;top:-6px;font-weight:800;font-size:150px;line-height:1;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:1.5px rgba(255,107,0,.55)}
.leak-head .lbl{color:var(--orange-2)}
.leak-head h2{color:#fff;margin:10px 0 10px;max-width:470px;font-size:34px}
.leak-head p{color:#C4CBDA;margin:0;max-width:500px;font-size:16.5px}
.trio{display:grid;gap:12px;margin:22px 0}
.trio>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;break-inside:avoid}
.trio .lbl{color:var(--muted);font-size:11px}
.trio p{margin:6px 0 0;font-size:16px}
.trio ul.plain{margin:8px 0 0}
.trio ul.plain li{font-size:16px;margin-bottom:5px}
.ask{background:var(--orange);color:var(--ink);border-radius:14px;padding:20px 24px;margin:22px 0 8px;break-inside:avoid}
.ask .lbl{color:#3a1a05}
.ask p{font-size:21px;line-height:1.35;font-weight:700;letter-spacing:-.015em;margin:6px 0 0;color:var(--ink)}

table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;margin:22px 0;border-radius:12px;border:1px solid var(--line);break-inside:avoid}
th{background:var(--night);color:#fff;text-align:left;padding:11px 14px;font-weight:600;font-size:14px}
td{background:#fff;padding:11px 14px;border-top:1px solid var(--line);color:var(--body)}
tr:nth-child(even) td{background:#F1F3F8}
td.hl{color:var(--rust);font-weight:700}

.checklist{margin:18px 0;counter-reset:q}
.checklist li{list-style:none;display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);break-inside:avoid}
.checklist li::before{counter-increment:q;content:counter(q,decimal-leading-zero);font-family:var(--mono);font-size:12px;color:var(--rust);padding-top:4px;min-width:22px}
.checklist li i{flex:0 0 20px;height:20px;border:2px solid var(--rust);border-radius:5px;margin-top:3px;order:3;margin-left:auto}
.checklist li span{font-size:16px;line-height:1.5;color:#232a3b}

.toc{list-style:none;margin:10px 0}
.toc li{display:flex;gap:16px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.toc li b{font-family:var(--mono);font-size:12px;color:var(--rust);min-width:56px;font-weight:500;letter-spacing:.1em}
.toc li span{color:var(--ink);font-weight:600}
.toc li em{font-style:normal;color:var(--muted);font-size:14.5px;margin-left:auto;text-align:right}
.toc .part{border-bottom:none;padding-top:22px}
.toc .part span{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500}

.sign{display:flex;gap:18px;align-items:center;margin-top:28px;break-inside:avoid}
.sign .ph{width:74px;height:74px;border-radius:50%;background:url(assets/andy.jpg) center 20%/cover}
.sign b{display:block;color:var(--rust);font-size:18px}
.sign small{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

.cta-btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px}
.btn{display:inline-block;background:var(--orange);color:var(--ink);font-weight:800;font-size:19px;padding:14px 24px;border-radius:12px;text-decoration:none}
.btn-ph{display:inline-block;border:1.5px dashed #8b93a7;color:#C4CBDA;padding:13px 20px;border-radius:12px;font-size:15px}
.logos{background:var(--night);border-radius:14px;padding:16px 22px;margin:22px 0;break-inside:avoid}
.logos img{display:block;width:100%;height:auto}
.src p{font-size:14.5px;line-height:1.55;margin-bottom:12px}
.src b{color:var(--ink)}

a{color:var(--rust)}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px}

@media (max-width:640px){
  body{font-size:16px}
  .txt{padding:44px 16px 56px}
  .txt h2{font-size:29px}
  .stats{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr 1fr}
  .op-num{font-size:110px}
  .leak-head .n{font-size:110px}
  .pull{font-size:21px}
}

@media print{
  html,body{background:#fff}
  body{font-size:10.6pt;line-height:1.62}
  .opener{page:full;break-before:page;break-after:page;width:210mm;height:296.6mm;min-height:0;padding:24mm 20mm 20mm}
  .cover{break-before:auto}
  .txt{max-width:none;padding:0;margin:0}
  .txt h2{font-size:25pt}
  .txt h3{font-size:15pt;margin-top:24pt}
  .txt p.lead{font-size:13.5pt}
  .pull{font-size:16pt}
  .op-title{font-size:56pt}
  .cover .op-title{font-size:68pt}
  .op-dek{font-size:13.5pt}
  .op-num{font-size:120pt}
  .leak-head h2{font-size:24pt}
  .ask p{font-size:15pt}
  .stat .n{font-size:24pt}
  .leak{font-size:10pt;line-height:1.55}
  .leak-head{padding:18pt 20pt 20pt;margin-bottom:14pt}
  .leak-head .n{font-size:96pt}
  .leak h3{margin-top:4pt;font-size:13pt}
  .trio{gap:7pt;margin:12pt 0}
  .trio>div{padding:9pt 13pt}
  .trio p,.trio ul.plain li{font-size:9.6pt;line-height:1.5}
  .trio ul.plain li{margin-bottom:2pt}
  .ask{padding:12pt 18pt;margin-top:12pt}
  .ask p{font-size:13pt}
  .toc li{padding:4.5pt 0}
  .toc .part{padding-top:12pt}
  .checklist li{padding:6.5pt 0}
  .checklist li span{font-size:10pt}
  .tbl{margin:12pt 0}
  td,th{padding:6pt 10pt;font-size:9.6pt}
  h2,h3,h4,.lbl{break-after:avoid}
}
</style>
</head>
<body>
